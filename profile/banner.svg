<svg width="4000" height="420" viewBox="0 0 4000 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.2;r:3}50%{opacity:.8;r:6}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px #D4AF37)}50%{filter:drop-shadow(0 0 30px #D4AF37) drop-shadow(0 0 60px #D4AF37)}}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 10px #D4AF37)}50%{filter:drop-shadow(0 0 40px #D4AF37) drop-shadow(0 0 80px rgba(212,175,55,.5))}}
@keyframes orbitA{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbitB{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes streamMove{0%{opacity:0;transform:translateX(0)}50%{opacity:1}100%{opacity:0;transform:translateX(200px)}}
@keyframes lineAnim{0%,100%{stroke-dashoffset:1000}50%{stroke-dashoffset:0}}
@keyframes subtitleFade{0%,100%{opacity:.6}50%{opacity:1}}
</style>
<radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
<stop offset="0%" stop-color="#080808"/>
<stop offset="100%" stop-color="#000000"/>
</radialGradient>
<radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#D4AF37" stop-opacity=".15"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>
<filter id="f1"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="f2"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="textGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="4000" height="420" fill="url(#bgGrad)"/>
<rect width="4000" height="420" fill="url(#coreGlow)"/>

<!-- Stars layer 1 -->
<circle cx="120" cy="30" r="1" fill="#fff" style="animation:twinkle 3.1s infinite"/>
<circle cx="340" cy="80" r="1.5" fill="#D4AF37" style="animation:twinkle 2.4s infinite"/>
<circle cx="560" cy="20" r="1" fill="#fff" style="animation:twinkle 4.2s infinite"/>
<circle cx="780" cy="65" r="1" fill="#7FDBFF" style="animation:twinkle 3.8s infinite"/>
<circle cx="950" cy="35" r="1.5" fill="#fff" style="animation:twinkle 2.1s infinite"/>
<circle cx="1150" cy="55" r="1" fill="#D4AF37" style="animation:twinkle 5.1s infinite"/>
<circle cx="1350" cy="25" r="1" fill="#fff" style="animation:twinkle 3.5s infinite"/>
<circle cx="1520" cy="70" r="1.5" fill="#7FDBFF" style="animation:twinkle 2.7s infinite"/>
<circle cx="1720" cy="40" r="1" fill="#fff" style="animation:twinkle 4.8s infinite"/>
<circle cx="1900" cy="60" r="1" fill="#D4AF37" style="animation:twinkle 3.2s infinite"/>
<circle cx="2100" cy="30" r="1.5" fill="#fff" style="animation:twinkle 2.9s infinite"/>
<circle cx="2300" cy="75" r="1" fill="#7FDBFF" style="animation:twinkle 4.4s infinite"/>
<circle cx="2500" cy="20" r="1" fill="#fff" style="animation:twinkle 3.7s infinite"/>
<circle cx="2700" cy="50" r="1.5" fill="#D4AF37" style="animation:twinkle 2.3s infinite"/>
<circle cx="2900" cy="35" r="1" fill="#fff" style="animation:twinkle 5.3s infinite"/>
<circle cx="3100" cy="65" r="1" fill="#7FDBFF" style="animation:twinkle 3.0s infinite"/>
<circle cx="3300" cy="28" r="1.5" fill="#fff" style="animation:twinkle 2.6s infinite"/>
<circle cx="3500" cy="58" r="1" fill="#D4AF37" style="animation:twinkle 4.1s infinite"/>
<circle cx="3750" cy="40" r="1" fill="#fff" style="animation:twinkle 3.4s infinite"/>
<circle cx="3950" cy="22" r="1.5" fill="#7FDBFF" style="animation:twinkle 2.8s infinite"/>

<!-- Stars layer 2 -->
<circle cx="200" cy="150" r="1" fill="#D4AF37" style="animation:twinkle 4.5s 1s infinite"/>
<circle cx="450" cy="200" r="1.5" fill="#fff" style="animation:twinkle 3.2s .5s infinite"/>
<circle cx="700" cy="130" r="1" fill="#7FDBFF" style="animation:twinkle 5.0s 2s infinite"/>
<circle cx="900" cy="180" r="1" fill="#fff" style="animation:twinkle 2.8s .3s infinite"/>
<circle cx="1100" cy="140" r="1.5" fill="#D4AF37" style="animation:twinkle 4.3s 1.2s infinite"/>
<circle cx="1300" cy="190" r="1" fill="#fff" style="animation:twinkle 3.6s .8s infinite"/>
<circle cx="1500" cy="155" r="1" fill="#7FDBFF" style="animation:twinkle 2.5s 1.5s infinite"/>
<circle cx="1700" cy="175" r="1.5" fill="#fff" style="animation:twinkle 4.7s .2s infinite"/>
<circle cx="3300" cy="165" r="1" fill="#fff" style="animation:twinkle 3.9s 1.8s infinite"/>
<circle cx="3500" cy="145" r="1.5" fill="#D4AF37" style="animation:twinkle 2.2s .6s infinite"/>
<circle cx="3700" cy="185" r="1" fill="#7FDBFF" style="animation:twinkle 4.6s 1.1s infinite"/>
<circle cx="3900" cy="155" r="1" fill="#fff" style="animation:twinkle 3.3s .9s infinite"/>

<!-- Stars layer 3 -->
<circle cx="80" cy="350" r="1" fill="#7FDBFF" style="animation:twinkle 3.8s .7s infinite"/>
<circle cx="300" cy="380" r="1.5" fill="#fff" style="animation:twinkle 2.4s 1.3s infinite"/>
<circle cx="550" cy="360" r="1" fill="#D4AF37" style="animation:twinkle 4.9s .4s infinite"/>
<circle cx="750" cy="390" r="1" fill="#fff" style="animation:twinkle 3.1s 1.7s infinite"/>
<circle cx="3200" cy="370" r="1" fill="#7FDBFF" style="animation:twinkle 5.2s .1s infinite"/>
<circle cx="3450" cy="355" r="1.5" fill="#D4AF37" style="animation:twinkle 2.7s 1.4s infinite"/>
<circle cx="3650" cy="385" r="1" fill="#fff" style="animation:twinkle 4.0s .6s infinite"/>
<circle cx="3850" cy="365" r="1" fill="#7FDBFF" style="animation:twinkle 3.5s 1.9s infinite"/>

<!-- Neural network nodes left -->
<circle cx="350" cy="180" r="3" fill="#D4AF37" opacity=".5" style="animation:twinkle 3s infinite"/>
<circle cx="620" cy="280" r="2" fill="#7FDBFF" opacity=".4" style="animation:twinkle 4s 1s infinite"/>
<circle cx="480" cy="340" r="2.5" fill="#D4AF37" opacity=".4" style="animation:twinkle 3.5s .5s infinite"/>
<circle cx="280" cy="310" r="2" fill="#fff" opacity=".3" style="animation:twinkle 5s 2s infinite"/>
<circle cx="700" cy="150" r="2" fill="#7FDBFF" opacity=".4" style="animation:twinkle 2.8s .3s infinite"/>

<!-- Neural lines left -->
<line x1="350" y1="180" x2="620" y2="280" stroke="#D4AF37" stroke-width=".5" stroke-opacity=".2" stroke-dasharray="8 4">
  <animate attributeName="stroke-opacity" values=".05;.3;.05" dur="4s" repeatCount="indefinite"/>
</line>
<line x1="620" y1="280" x2="480" y2="340" stroke="#7FDBFF" stroke-width=".5" stroke-opacity=".15" stroke-dasharray="6 4">
  <animate attributeName="stroke-opacity" values=".05;.25;.05" dur="5s" repeatCount="indefinite"/>
</line>
<line x1="280" y1="310" x2="480" y2="340" stroke="#D4AF37" stroke-width=".5" stroke-dasharray="5 5">
  <animate attributeName="stroke-opacity" values=".05;.2;.05" dur="3.5s" repeatCount="indefinite"/>
</line>
<line x1="350" y1="180" x2="700" y2="150" stroke="#7FDBFF" stroke-width=".5" stroke-dasharray="8 4">
  <animate attributeName="stroke-opacity" values=".05;.2;.05" dur="6s" repeatCount="indefinite"/>
</line>

<!-- Neural network nodes right -->
<circle cx="3650" cy="180" r="3" fill="#D4AF37" opacity=".5" style="animation:twinkle 3.2s infinite"/>
<circle cx="3380" cy="280" r="2" fill="#7FDBFF" opacity=".4" style="animation:twinkle 4.2s 1s infinite"/>
<circle cx="3520" cy="340" r="2.5" fill="#D4AF37" opacity=".4" style="animation:twinkle 3.7s .5s infinite"/>
<circle cx="3720" cy="310" r="2" fill="#fff" opacity=".3" style="animation:twinkle 5.2s 2s infinite"/>
<circle cx="3300" cy="150" r="2" fill="#7FDBFF" opacity=".4" style="animation:twinkle 2.9s .3s infinite"/>

<!-- Neural lines right -->
<line x1="3650" y1="180" x2="3380" y2="280" stroke="#D4AF37" stroke-width=".5" stroke-dasharray="8 4">
  <animate attributeName="stroke-opacity" values=".05;.3;.05" dur="4s" repeatCount="indefinite"/>
</line>
<line x1="3380" y1="280" x2="3520" y2="340" stroke="#7FDBFF" stroke-width=".5" stroke-dasharray="6 4">
  <animate attributeName="stroke-opacity" values=".05;.25;.05" dur="5s" repeatCount="indefinite"/>
</line>
<line x1="3720" y1="310" x2="3520" y2="340" stroke="#D4AF37" stroke-width=".5" stroke-dasharray="5 5">
  <animate attributeName="stroke-opacity" values=".05;.2;.05" dur="3.5s" repeatCount="indefinite"/>
</line>

<!-- Orbital ring 1 (slow, gold) -->
<g style="transform-origin:2000px 210px">
<ellipse cx="2000" cy="210" rx="380" ry="60" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity=".25" stroke-dasharray="20 10">
  <animateTransform attributeName="transform" type="rotate" from="0 2000 210" to="360 2000 210" dur="25s" repeatCount="indefinite"/>
</ellipse>
</g>
<!-- Orbital ring 2 (medium, cyan) -->
<ellipse cx="2000" cy="210" rx="440" ry="30" fill="none" stroke="#7FDBFF" stroke-width=".8" stroke-opacity=".15" stroke-dasharray="15 8">
  <animateTransform attributeName="transform" type="rotate" from="0 2000 210" to="-360 2000 210" dur="18s" repeatCount="indefinite"/>
</ellipse>
<!-- Orbital ring 3 (fast, gold) -->
<ellipse cx="2000" cy="210" rx="520" ry="90" fill="none" stroke="#D4AF37" stroke-width=".6" stroke-opacity=".12" stroke-dasharray="12 15">
  <animateTransform attributeName="transform" type="rotate" from="0 2000 210" to="360 2000 210" dur="40s" repeatCount="indefinite"/>
</ellipse>

<!-- Central core glow -->
<circle cx="2000" cy="210" r="80" fill="#D4AF37" fill-opacity=".04">
  <animate attributeName="r" values="70;95;70" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="fill-opacity" values=".04;.09;.04" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="2000" cy="210" r="40" fill="#D4AF37" fill-opacity=".08">
  <animate attributeName="r" values="35;55;35" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="2000" cy="210" r="8" fill="#D4AF37" opacity=".9">
  <animate attributeName="opacity" values=".7;1;.7" dur="2s" repeatCount="indefinite"/>
</circle>

<!-- Data stream particles left to center -->
<circle cx="800" cy="210" r="2" fill="#D4AF37" opacity="0">
  <animate attributeName="cx" values="800;1950" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="500" cy="210" r="1.5" fill="#7FDBFF" opacity="0">
  <animate attributeName="cx" values="500;1950" dur="5s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.6;0" dur="5s" begin="1s" repeatCount="indefinite"/>
</circle>
<circle cx="300" cy="210" r="2" fill="#D4AF37" opacity="0">
  <animate attributeName="cx" values="300;1950" dur="6s" begin="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="2s" repeatCount="indefinite"/>
</circle>

<!-- Data stream particles right to center -->
<circle cx="3200" cy="210" r="2" fill="#D4AF37" opacity="0">
  <animate attributeName="cx" values="3200;2050" dur="4s" begin=".5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.8;0" dur="4s" begin=".5s" repeatCount="indefinite"/>
</circle>
<circle cx="3500" cy="210" r="1.5" fill="#7FDBFF" opacity="0">
  <animate attributeName="cx" values="3500;2050" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.6;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
</circle>
<circle cx="3700" cy="210" r="2" fill="#D4AF37" opacity="0">
  <animate attributeName="cx" values="3700;2050" dur="6s" begin="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="2.5s" repeatCount="indefinite"/>
</circle>

<!-- Horizontal separator lines -->
<line x1="100" y1="210" x2="1700" y2="210" stroke="#D4AF37" stroke-width=".4" stroke-opacity=".1" stroke-dasharray="20 10"/>
<line x1="2300" y1="210" x2="3900" y2="210" stroke="#D4AF37" stroke-width=".4" stroke-opacity=".1" stroke-dasharray="20 10"/>

<!-- MAIN TITLE -->
<text x="2000" y="180" text-anchor="middle" font-family="Georgia,serif" font-size="88" font-weight="bold" letter-spacing="18" fill="#D4AF37" filter="url(#textGlow)">ORAKZAI GROUP
  <animate attributeName="opacity" values=".85;1;.85" dur="4s" repeatCount="indefinite"/>
</text>

<!-- Title underline -->
<rect x="1680" y="192" width="640" height="1.5" fill="#D4AF37" rx="1">
  <animate attributeName="opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/>
</rect>

<!-- Subtitle 1 -->
<text x="2000" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="22" letter-spacing="8" fill="#FFFFFF" opacity=".7">Global Systems Architecture
  <animate attributeName="opacity" values=".5;.85;.5" dur="5s" repeatCount="indefinite"/>
</text>

<!-- Subtitle 2 -->
<text x="2000" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="4" fill="#7FDBFF" opacity=".6">12 Strategic Divisions  ◆  250 Integrated Projects  ◆  One Ecosystem
  <animate attributeName="opacity" values=".4;.8;.4" dur="6s" repeatCount="indefinite"/>
</text>

<!-- Bottom tagline -->
<text x="2000" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="3" fill="#D4AF37" opacity=".4" font-style="italic">Designing systems that compound across generations
  <animate attributeName="opacity" values=".2;.5;.2" dur="7s" repeatCount="indefinite"/>
</text>

<!-- Corner accents -->
<polygon points="50,20 50,60 20,60" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity=".5"/>
<polygon points="3950,20 3950,60 3980,60" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity=".5"/>
<polygon points="50,400 50,360 20,360" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity=".5"/>
<polygon points="3950,400 3950,360 3980,360" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity=".5"/>
</svg>
