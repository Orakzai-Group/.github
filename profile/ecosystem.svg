<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@keyframes nodeGlow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes lineFlow{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
@keyframes centerPulse{0%,100%{r:45;opacity:.9}50%{r:55;opacity:1}}
@keyframes ringExpand{0%{r:70;opacity:.3}100%{r:130;opacity:0}}
</style>
<radialGradient id="bg2" cx="50%" cy="50%" r="70%">
<stop offset="0%" stop-color="#050505"/>
<stop offset="100%" stop-color="#000000"/>
</radialGradient>
<radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#D4AF37" stop-opacity=".3"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>
<filter id="gf"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1200" height="620" fill="url(#bg2)"/>

<!-- Background stars -->
<circle cx="50" cy="50" r="1" fill="#D4AF37" opacity=".3"><animate attributeName="opacity" values=".1;.6;.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="30" r=".8" fill="#fff" opacity=".3"><animate attributeName="opacity" values=".1;.5;.1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="1100" cy="80" r="1" fill="#7FDBFF" opacity=".3"><animate attributeName="opacity" values=".1;.6;.1" dur="3.5s" repeatCount="indefinite"/></circle>
